name: CDK CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-west-2'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        # --coverage enforces the coverageThreshold in jest.config.js. Without
        # it the threshold is declared and never checked.
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      # Synthesising every environment is what catches cross-stack dependency
      # cycles; per-stack unit tests pass either way.
      - name: Synthesize CDK (all environments)
        run: |
          for e in dev staging prod; do
            echo "::group::cdk synth --context env=$e"
            npx cdk synth --all --context env="$e"
            echo "::endgroup::"
          done

      - name: Upload CDK output
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synthesize CDK
        run: npx cdk synth --all --context env=prod

      # No continue-on-error: a cfn-nag failure fails the build.
      - name: Run cfn-nag
        uses: stelligent/cfn_nag@master
        with:
          input_path: cdk.out

# There is no `cdk diff` job. Diffing against a live account needs an OIDC role
# with read access, which this repository does not have configured; a job that
# checks out, builds and posts nothing would report a green "CDK Diff" check
# having diffed nothing. Add it together with the role, not before.
